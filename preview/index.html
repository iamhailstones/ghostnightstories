{id:0,t:'The Seventh Tenant',c:'Haunted Houses',k:'haunt',a:'M. Okafor',m:12,i:4,ch:5,d:'Every flat in the building has six locks. Hers has seven.',p:"The letting agent never mentioned that the flat had been empty for eleven years. She mentioned the view, the radiators, the quiet. Mara signed on the hood of her car, in the rain.|On the first night she counted the locks. Six on the door, brass, each stiffer than the last. She turned them all.|On the second night she found a seventh, low on the frame, at the height of a child's hand. It was already turned.|She laid her palm on the wood. Something on the other side shifted its weight, patiently, the way you do after years of waiting.|\"Hello?\" she said, and felt ridiculous. The lock clicked. From the inside."},
{id:1,t:'What the Well Remembers',c:'African Folklore Horror',k:'folk',a:'T. Adeyemi',m:18,i:5,ch:7,d:'The village stopped drawing water at night. Nobody would say why.',p:"Grandmother never let us near the well after dusk. She said the water kept a ledger.|My cousin laughed and dropped a coin in. For a moment, from far below, a voice counted it.|By morning the coin was back on our doorstep, wet, with one more beside it."},
{id:2,t:'Room 9, Third Shift',c:'Psychological Horror',k:'psy',a:'Anonymous',m:9,i:3,ch:3,d:'The night nurse keeps charting a patient who was discharged in 1994.',p:"The chart for Room 9 was blank at midnight. At 3 a.m. it held four lines of handwriting. Hers.|She hadn't written them. She checked her own signature twice. It matched perfectly.|The last line read: she is finally looking at the camera."},
{id:3,t:'Passenger, Mile 114',c:'Urban Legends',k:'urban',a:'R. Vance',m:7,i:3,ch:2,d:'A hitchhiker who always asks the same question.',p:"He stood where the streetlights stopped. He asked, politely, if I knew how long it had been.|I said it was nearly midnight. He said, no, how long since he'd stopped being warm."},
{id:4,t:'The Quiet Stage',c:'Possession Stories',k:'demon',a:'L. Haddad',m:22,i:5,ch:8,d:'The understudy knows every line. She has never rehearsed.',p:"The theatre had been dark for a decade when we reopened it. The ghost light was still burning."},
{id:5,t:'Forty Days of Static',c:'Unexplained Disappearances',k:'miss',a:'J. Brandt',m:14,i:4,ch:6,d:'A radio operator vanishes. His log does not.',p:"The log continued after he left. Same hand. Same dry tone. Only the weather reports changed."},
{id:6,t:'Lullaby for the Landlord',c:'Ghost Stories',k:'ghost',a:'S. Moreau',m:6,i:2,ch:1,d:'A quiet one. The kind that follows you home.',p:"The humming started in the walls the week the rent was due."},
{id:7,t:'The Man Who Collected Doors',c:'Serial Killers',k:'demon',a:'D. Kessler',m:25,i:5,ch:9,d:'Detective fiction with a very wrong door.',p:"Every victim's front door was missing. Not broken. Removed, carefully, hinges and all."}];

function dots(n){return'<span class="int">'+[1,2,3,4,5].map(x=>`<i class="${x<=n?'f':''}"></i>`).join('')+'</span>'}
function card(s,cls=''){return`<div class="card ${cls}" onclick="rd(${s.id})"><div class="cv" style="--c1:${C[s.k]};${COV[s.id]?`background-image:linear-gradient(#0002,#000a),url(${COV[s.id]});background-size:cover;background-position:center`:''}"></div><div class="meta">${s.c}</div><h3>${s.t}</h3><p>${s.d}</p><div class="meta" style="margin-top:8px">${s.m} min · ${s.ch} ch · ${dots(s.i)}</div></div>`}
function rd(i){cur=i;go('Read')}
function go(t){tab=t;adm=0;stopA();scrollTo(0,0);draw()}
function draw(){$('#nav').innerHTML=T.map(x=>`<button class="${!adm&&x==tab?'on':''}" onclick="go('${x}')">${x}</button>`).join('');const v=adm?Admin():V_[tab]();$('#m').innerHTML=v;if(V_.after[tab]&&!adm)V_.after[tab]()}

Interactive:()=>`<h2 class="s">Interactive stories</h2><div class="ctl">${Object.keys(IS).map(k=>`<button class="ghost ${k==ik?'on':''}" onclick="ik='${k}';node('s');go('Interactive')">${IS[k].n}</button>`).join('')}</div><div class="card" style="cursor:default"><div class="meta" id="ist"></div><h3 id="it" style="font-size:26px;line-height:1.2"></h3><div id="io" style="margin-top:12px"></div></div>`,
'Daily Mystery':()=>`<h2 class="s">The Lighthouse Keeper Who Kept Logging</h2><div class="meta">Day 1 of 5 · Fictional</div><p>Forty days after the tower was abandoned, the logbook kept filling with fresh entries in the same handwriting.</p><h2 class="s" style="font-size:22px">Evidence</h2><p>A salt-stained pen. A second set of footprints. A tide table for a year that has not happened.</p><h2 class="s" style="font-size:22px">Reader theories</h2><div id="th"><div class="card" style="cursor:default"><p>The keeper never left; the tower is logging itself.</p></div><div class="card" style="cursor:default"><p>Someone wanted the lamp to stay lit.</p></div></div><div class="ctl"><textarea id="tx" rows="2" placeholder="Your theory"></textarea><button class="go" onclick="th()">Submit theory</button></div><button class="ghost" onclick="toast('Revelation unlocks at midnight')">Reveal the answer</button>`,
Archive:()=>`<h2 class="s">The Unknown Archive</h2><div class="file"><div class="stamp">CLASSIFIED</div><h3>CASE 0417</h3><div>LOCATION: Mill Road, <b>REDACTED</b></div><div>DATE: 14 NOV 1987 · LEVEL: 3</div><div>STATUS: Open, unresolved</div><p><b>EVIDENCE</b> Six photographs. The same field, the same lights, a different number each time.</p><p><b>WITNESS</b> "They didn't move. They waited until we looked away."</p><p><b>NOTES</b> Compass failure within 200 m. Two investigators unavailable for comment.</p><div class="fic">Fictional case file. Not a real-world report.</div></div><button class="ghost" onclick="toast('Case 0418 opens here')">Next case</button>`,
Submit:()=>`<h2 class="s">Submit your story</h2><div class="ctl" style="display:block"><p style="font-size:15px;font-family:var(--u);color:var(--ash)">Every story is reviewed by a moderator before it appears. Submit only stories you wrote yourself.</p><input type="text" id="sx" placeholder="Title" style="margin-bottom:10px"><select style="margin-bottom:10px">${[...new Set(S.map(s=>s.c))].map(c=>`<option>${c}</option>`).join('')}</select><textarea id="sy" rows="6" placeholder="Full story" style="margin-bottom:10px"></textarea><label><input type="checkbox"> Post as anonymous</label><br><br><button class="go" onclick="sub()">Send for review</button></div>`,
'My Library':()=>`<h2 class="s">My library</h2><div class="meta">Bookmarks and reading progress</div><div class="grid">${[...mark].map(i=>card(S[i])+`<div class="meta" style="margin-top:-6px">Read ${prog[i]||0}%</div>`).join('')||'<p>Nothing saved yet. Bookmark a story in the reader.</p>'}</div>`,
after:{Explore:()=>ex()}};
function ex(){const q=($('#q').value||'').toLowerCase(),c=$('#cat').value,o=$('#so').value;let r=S.filter(s=>(!c||s.c==c)&&(s.t+s.d).toLowerCase().includes(q));r.sort((a,b)=>o=='i'?b.i-a.i:o=='m'?a.m-b.m:b.id-a.id);$('#res').innerHTML=r.map(s=>card(s)).join('')||'<p>No stories match. Clear the search or pick another category.</p>'}
function bk(){mark.has(cur)?mark.delete(cur):mark.add(cur);draw();toast(mark.has(cur)?'Saved to My Library':'Removed')}
function th(){const v=$('#tx').value.trim();if(!v)return toast('Write a theory first');$('#th').insertAdjacentHTML('beforeend',`<div class="card" style="cursor:default"><p>${v.replace(/</g,'&lt;')}</p><div class="meta">You · just now</div></div>`);$('#tx').value=''}
function sub(){if(!$('#sx').value||!$('#sy').value)return toast('Add a title and story');toast('Sent. Status: In moderation');$('#sx').value=$('#sy').value=''}
const IS={d:{n:'The Knock',s:["2:17 AM. Someone is knocking at your bedroom door.",[["Open the door","a"],["Look through the window","b"],["Hide under the bed","c"],["Call someone","e"]]],a:["The hallway is empty. The knocking continues, now from inside the room.",[["Turn around","x1"],["Run","x2"]]],b:["Your own face looks back from the glass, knocking.",[["Knock back","x1"],["Draw the curtains","x2"]]],c:["Someone is already under the bed. 'Move over,' it whispers.",[["Move over","x1"],["Scream","x2"]]],e:["Your phone rings first. It is your own number.",[["Answer","x1"],["Hang up","x2"]]],x1:["Ending: The Guest. You live. You are less sure who woke up.",[["Replay","s"]],1],x2:["Ending: Last Light. The house goes quiet.",[["Replay","s"]],1]},
 w:{n:'The Well',s:["Dusk. The well is humming.",[["Lean over","a"],["Walk away","b"]]],a:["Something below counts your heartbeats.",[["Count with it","x1"]]],b:["Behind you, your footsteps continue after you stop.",[["Look back","x1"]]],x1:["Ending: Paid in full.",[["Replay","s"]],1]}};
let ik='d',life=3;function node(k){const n=IS[ik][k];if(!$('#it'))return;$('#it').textContent=n[0];$('#ist').textContent=n[2]?'Ending reached · Survival: uncertain':'Decision · Survival: '+(k=='s'?'alive':'at risk');$('#io').innerHTML=n[1].map(o=>`<button class="opt" onclick="node('${o[1]}')">${o[0]}</button>`).join('')}
const _a=V_.after;_a.Interactive=()=>node('s');
function Admin(){return`<h2 class="s">Admin dashboard</h2><div class="stat"><div><b>1,284</b>readers this week</div><div><b>${S.length}</b>stories live</div><div><b>3</b>in moderation</div><div><b>${V.filter(v=>v.ok&&v.on).length}</b>working scare videos</div></div>${storiesAdmin()}<h2 class="s" style="font-size:24px">Jumpscare video manager</h2><table><tr><th>URL<th>Cat<th>Level<th>Status<th>On</tr>${V.map((v,i)=>`<tr><td>${v.u}<td>${v.cat}<td>${v.lv}<td class="${v.ok?'ok':'bad'}">${v.ok?'Playable':'Broken'}<td><button class="tg ${v.on?'on':''}" onclick="V[${i}].on^=1;draw()"></button></tr>`).join('')}</table><div class="ctl"><input type="text" id="nv" placeholder="https://.../clip.mp4"><button class="go" onclick="av()">Add and test</button></div><h2 class="s" style="font-size:24px">Moderation queue</h2><div class="card" style="cursor:default"><h3>The Stairwell Count</h3><p>Submitted by Anonymous</p><div class="ctl"><button class="ghost" onclick="toast('Approved')">Approve</button><button class="ghost" onclick="toast('Edits requested')">Request edits</button><button class="ghost" onclick="toast('Rejected')">Reject</button></div></div>`}

const CATS=['Paranormal Encounters','Ghost Stories','Demonic Encounters','Haunted Houses','Psychological Horror','Serial Killers','Supernatural Mysteries','Urban Legends','Disturbing True Experiences','Possession Stories','Creature Horror','Dark Mysteries','African Folklore Horror','Unexplained Disappearances'];
let eds=null;const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function storiesAdmin(){if(eds!==null){const s=S[eds];return`<h2 class="s" style="font-size:24px">Edit story</h2><div style="display:grid;gap:10px"><input type="text" id="ei_t" value="${esc(s.t)}" placeholder="Title"><select id="ei_c">${CATS.map(c=>`<option ${c==s.c?'selected':''}>${c}</option>`).join('')}</select><input type="text" id="ei_a" value="${esc(s.a)}" placeholder="Author"><input type="text" id="ei_d" value="${esc(s.d)}" placeholder="One-sentence description"><textarea id="ei_p" rows="12" placeholder="Story text. New paragraph on a new line.">${esc(s.p.split('|').join('\n\n'))}</textarea><div class="ctl"><button class="go" onclick="saveE()">Save</button><button class="ghost" onclick="eds=null;draw()">Cancel</button></div></div>`}
return`<h2 class="s" style="font-size:24px">All stories</h2><div class="ctl"><button class="go" onclick="newS()">New story</button></div>`+S.map((s,i)=>`<div class="card" style="cursor:default"><div class="meta">Published · ${esc(s.c)}</div><h3>${esc(s.t)}</h3><div class="ctl"><button class="ghost" onclick="eds=${i};draw()">Edit</button></div></div>`).join('')}
function saveE(){const s=S[eds];s.t=$('#ei_t').value.trim()||'Untitled';s.c=$('#ei_c').value;s.a=$('#ei_a').value;s.d=$('#ei_d').value;s.p=$('#ei_p').value.split(/\n+/).map(x=>x.trim()).filter(Boolean).join('|')||'Write here.';eds=null;draw();toast('Saved (preview only, not stored)')}
function newS(){S.push({id:S.length,t:'Untitled story',c:'Ghost Stories',k:'ghost',a:'You',m:5,i:3,ch:1,d:'',p:'Write here.'});eds=S.length-1;draw()}
$('#adm').onclick=()=>{adm=1;draw()};
function av(){const u=$('#nv').value.trim();if(!/^https:\/\/.+\.(mp4|webm)$/i.test(u))return toast('Use an https link ending in .mp4 or .webm');V.push({u,cat:'Any',lv:'Mild',on:1,ok:1});draw();toast('Added. Test passed')}
function jen(e){if(e.checked){e.checked=false;$('#warn').style.display='flex'}else{clearTimeout(tm)}}
$('#no').onclick=()=>$('#warn').style.display='none';
$('#yes').onclick=()=>{$('#warn').style.display='none';$('#en').checked=true;ac=ac||new(window.AudioContext||webkitAudioContext)();arm();toast('Jumpscares on')};
function arm(){clearTimeout(tm);if(!$('#en')||!$('#en').checked)return;const m={Mild:[40,90],Extreme:[20,50],Nightmare:[10,30]}[$('#in').value];tm=setTimeout(()=>{if(tab=='Read'&&scrollY>150)scare();arm()},(m[0]+Math.random()*(m[1]-m[0]))*1000)}
function tst(){if(!$('#en').checked){$('#warn').style.display='flex';return}lastS=0;scare()}
function scare(){if(Date.now()-lastS<8000)return;lastS=Date.now();const y=scrollY,s=$('#scare'),ok=V.filter(v=>v.on&&v.ok);s.style.display='flex';s.classList.add('f');if(ok.length)console.log('video:',ok[Math.floor(Math.random()*ok.length)].u);
if(!$('#mu').checked&&ac){const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(900,ac.currentTime);o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+.9);g.gain.setValueAtTime(.4,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1)}
setTimeout(()=>{s.style.display='none';s.classList.remove('f');scrollTo(0,y)},1400)}
$('#scare').onclick=()=>$('#scare').style.display='none';
function ply(re){const ss=window.speechSynthesis;if(!ss)return toast('Narration needs a browser with speech support');if(sp&&!re){stopA();return}ss.cancel();const u=new SpeechSynthesisUtterance(S[cur].p.replace(/\|/g,' '));u.rate=+$('#spd').value;u.pitch=.7;u.onend=()=>{sp=null;if($('#pp'))$('#pp').textContent='Listen'};sp=u;ss.speak(u);$('#pp').textContent='Pause';$('#pb').style.transition='width '+(S[cur].m*6)+'s linear';$('#pb').style.width='100%'}
function stopA(){window.speechSynthesis&&speechSynthesis.cancel();sp=null;if($('#pp')){$('#pp').textContent='Listen';$('#pb').style.width='0'}}
function amb(e){if(!e.checked){ambient&&ambient.stop();ambient=null;return}ac=ac||new(window.AudioContext||webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ac.createBufferSource();n.buffer=b;n.loop=true;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=400;const g=ac.createGain();g.gain.value=.06;n.connect(f).connect(g).connect(ac.destination);n.start();ambient=n}
addEventListener('scroll',()=>{if(tab=='Read'){prog[cur]=Math.min(100,Math.round(scrollY/Math.max(1,document.body.scrollHeight-innerHeight)*100))}});
draw();
</script></body></html>
